plugins { id 'com.android.application' }

android {
    namespace 'com.hydroinspect.operator'
    compileSdk 36
    defaultConfig {
        applicationId 'com.hydroinspect.operator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('HYDRO_KEYSTORE')) {
                storeFile file(System.getenv('HYDRO_KEYSTORE'))
                storeType 'PKCS12'
                storePassword System.getenv('HYDRO_STORE_PASSWORD')
                keyAlias 'hydroinspect'
                keyPassword System.getenv('HYDRO_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.guava:guava:33.4.8-android'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
